<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroBro Lab</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; padding: 20px; color: #fff;
        }
        .container { max-width: 400px; width: 100%; text-align: center; }
        .logo-text { font-size: 64px; font-weight: 900; color: #007AFF; margin-bottom: 10px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .sub { color: #8e8e93; font-size: 15px; margin-bottom: 36px; }
        
        .install-btn {
            display: block; width: 100%; padding: 16px; margin-bottom: 14px;
            border: none; border-radius: 16px; font-size: 16px; font-weight: 600;
            cursor: pointer; background: #007AFF; color: #fff;
        }
        .nav-btn {
            display: block; padding: 16px; margin-bottom: 12px; border-radius: 16px;
            text-decoration: none; font-size: 16px; font-weight: 600; 
            background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
        }
        .chrome-hint {
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            border-radius: 16px; padding: 20px; margin-bottom: 36px; text-align: center;
        }
        .copy-btn {
            padding: 12px 24px; border: none; border-radius: 12px; font-size: 15px;
            cursor: pointer; background: #007AFF; color: #fff; width: 100%; margin-top: 12px;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #1c1c1e; border-radius: 24px; padding: 28px; text-align: center; max-width: 320px;
        }
        .step { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; text-align: left; }
        .step-num { background: #007AFF; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">B</div>
        <h1>BroBro Lab</h1>
        <div class="sub">Самый близкий сервис Apple</div>

        <!-- Блок для НЕ Chrome браузеров -->
        <div class="chrome-hint" id="chromeHint" style="display:none;">
            <div style="font-size:18px; font-weight:700; margin-bottom:10px; color:#007AFF;">🔵 Вы не в Chrome</div>
            <p>Для установки приложения нужен Chrome.</p>
            <button class="copy-btn" id="copyLinkBtn">📋 Скопировать ссылку</button>
            <button class="copy-btn" id="openChromeBtn" style="background:#2c2c2e; margin-top:8px;">🌐 Открыть в Chrome</button>
        </div>

        <!-- Кнопки установки -->
        <div id="installButtons">
            <button class="install-btn" id="installBtnAndroid">📱 Установить приложение</button>
            <button class="install-btn" id="installBtnIOS">🍏 Инструкция для iPhone</button>
        </div>

        <div style="margin-top: 36px;">
            <a href="https://brobrostore.ru/" class="nav-btn">🛒 Магазин техники</a>
            <a href="https://brobrolab.ru/service" class="nav-btn">🛠 Сервис и ремонт</a>
            <a href="tel:+74991101785" class="nav-btn">📞 Позвонить</a>
        </div>
    </div>

    <!-- Модалка для iOS -->
    <div class="modal" id="iosModal">
        <div class="modal-content">
            <h3 style="color:#007AFF; margin-bottom:20px;">Установка на iPhone</h3>
            <div class="step"><span class="step-num">1</span><span>Нажми «Поделиться» ⎕ внизу</span></div>
            <div class="step"><span class="step-num">2</span><span>Выбери «На экран «Домой»»</span></div>
            <div class="step"><span class="step-num">3</span><span>Нажми «Добавить»</span></div>
            <button class="install-btn" onclick="document.getElementById('iosModal').classList.remove('show')">Закрыть</button>
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        const installBtnAndroid = document.getElementById('installBtnAndroid');
        const installBtnIOS = document.getElementById('installBtnIOS');
        const chromeHint = document.getElementById('chromeHint');
        const ua = navigator.userAgent;
        
        // Проверка: уже установлено?
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const isIOS = /iPhone|iPad|iPod/.test(ua);
        const isChrome = /Chrome/.test(ua) && !/YaBrowser|OPR|Firefox|SamsungBrowser|Edg/.test(ua);

        if (!isStandalone) {
            if (isIOS) {
                // На iOS всегда показываем кнопку инструкции
                installBtnAndroid.style.display = 'none';
            } else if (!isChrome) {
                // Если не iOS и не Chrome — показываем подсказку
                document.getElementById('installButtons').style.display = 'none';
                chromeHint.style.display = 'block';
            }
        } else {
            // Если уже установлено — скрываем всё лишнее
            document.getElementById('installButtons').style.display = 'none';
            chromeHint.style.display = 'none';
        }

        // Логика кнопки Android
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtnAndroid.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installButtons').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Логика кнопки iOS
        installBtnIOS.addEventListener('click', () => {
            document.getElementById('iosModal').classList.add('show');
        });

        // Копирование ссылки
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href);
            alert('Ссылка скопирована! Откройте Chrome и вставьте её.');
        });

        // Открытие в Chrome (Android Intent)
        document.getElementById('openChromeBtn').addEventListener('click', () => {
            const url = window.location.href.replace(/^https?:\/\//, '');
            window.location.href = 'intent://' + url + '#Intent;scheme=googlechrome;end';
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
