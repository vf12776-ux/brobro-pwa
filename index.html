<script>
    // === Service Worker ===
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW registered'))
                .catch(err => console.log('SW error:', err));
        });
    }

    // === Статус сети ===
    const statusEl = document.getElementById('status');
    function updateStatus() {
        if (navigator.onLine) {
            statusEl.textContent = 'Онлайн';
            statusEl.classList.remove('offline'); statusEl.classList.add('online');
        } else {
            statusEl.textContent = 'Офлайн (контакты доступны)';
            statusEl.classList.remove('online'); statusEl.classList.add('offline');
        }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    // === ЛОГИКА УСТАНОВКИ (РФ-совместимая) ===
    const installBar = document.getElementById('installBar');
    const installBarText = document.getElementById('installBarText');
    const iosOverlay = document.getElementById('iosOverlay');
    const openSafariOverlay = document.getElementById('openSafariOverlay');
    const macSafariOverlay = document.getElementById('macSafariOverlay');

    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isMac = /Macintosh/.test(ua) && !isIOS;
    const isAndroid = /Android/.test(ua);
    const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|Edg|OPR|YaBrowser|SamsungBrowser/.test(ua);
    const isChromium = /Chrome|CriOS|Edg|OPR|YaBrowser|SamsungBrowser/.test(ua);

    // Уже установлено?
    function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
    }

    if (!isStandalone()) {

        // === iOS + SAFARI: показываем инструкцию по клику ===
        if (isIOS && isSafari) {
            installBar.style.display = 'flex';
            installBarText.textContent = 'Установить на iPhone';
            installBar.addEventListener('click', () => {
                iosOverlay.style.display = 'flex';
            });
            document.getElementById('iosCloseBtn').addEventListener('click', () => {
                iosOverlay.style.display = 'none';
            });
        }
        // === iOS + НЕ SAFARI (Chrome/Яндекс и т.д.): предлагаем открыть в Safari ===
        else if (isIOS && !isSafari) {
            installBar.style.display = 'flex';
            installBarText.textContent = 'Установить на iPhone';
            installBar.addEventListener('click', () => {
                openSafariOverlay.style.display = 'flex';
            });
            document.getElementById('openSafariBtn').addEventListener('click', () => {
                // Открываем текущую страницу в Safari
                window.location.href = 'safari://' + window.location.host + window.location.pathname;
            });
            document.getElementById('openSafariDismiss').addEventListener('click', () => {
                openSafariOverlay.style.display = 'none';
            });
        }
        // === macOS + SAFARI: инструкция «Файл → Добавить в Dock» ===
        else if (isMac && isSafari) {
            installBar.style.display = 'flex';
            installBarText.textContent = 'Добавить в Dock';
            installBar.addEventListener('click', () => {
                macSafariOverlay.style.display = 'flex';
            });
            document.getElementById('macSafariCloseBtn').addEventListener('click', () => {
                macSafariOverlay.style.display = 'none';
            });
        }
        // === Android / Windows / macOS + Chromium (Chrome/Edge/Яндекс/Opera): системная установка ===
        else if (isChromium) {
            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBar.style.display = 'flex';
                installBarText.textContent = 'Установить приложение';
            });

            installBar.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        installBar.style.display = 'none';
                    }
                    deferredPrompt = null;
                } else {
                    // Если beforeinstallprompt не сработал — показываем общую инструкцию
                    alert('Используйте меню браузера (⋮) → «Установить приложение» или «Добавить на главный экран»');
                }
            });

            window.addEventListener('appinstalled', () => {
                installBar.style.display = 'none';
            });
        }
    }
</script>
