<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет подключения | BroBro Lab</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo-svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            fill: #ffffff;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            color: #86868b;
            font-size: 17px;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.5;
        }
        .install-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
            background: linear-gradient(180deg, #2E5CFF 0%, #0040DD 100%);
            color: #fff;
            box-shadow:
                0 4px 12px rgba(0, 64, 221, 0.4),
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -1px 0 rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }
        .install-btn:active { transform: scale(0.96); }
    </style>
</head>

    <div class="container">

        <h1>Нет подключения</h1>
        <div class="sub">
            Проверьте соединение с интернетом.<br>

        </div>

        <button class="install-btn" onclick="window.location.reload()">
            🔄 Обновить страницу

</html>
